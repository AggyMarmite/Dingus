name: Release

# Run by hand only (Actions → Release → Run workflow), when a release is wanted: builds the installer (plus the Linux
# AppImage) for the
# <Version> in Dingus.csproj and publishes it as release vX.Y.Z – unless that release already exists.
# Pushing to main never releases anything; it only builds and tests. The app's updater offers the
# Dingus-Setup-x.y.z.exe attached to the latest release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content Dingus.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$v already exists – nothing to do."; "skip=true" >> $env:GITHUB_OUTPUT }
          else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      # Framework-dependent: the installer adds the .NET 8 Desktop Runtime only if the PC doesn't have it.
      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        run: dotnet publish Dingus.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\publish installer\Dingus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # Only this version's notes (the first section of the file), not the whole history.
          $all = Get-Content installer\release-notes.md -Raw
          $parts = $all -split '(?m)^## '
          $mine = ($parts | Where-Object { $_.Trim() } | Select-Object -First 1)
          $body = ($mine -replace '^[^\r\n]*\r?\n', '').Trim()
          Set-Content -Path release-body.md -Value $body -Encoding UTF8
          gh release create "v$v" "installer\Output\Dingus-Setup-$v.exe" --repo ${{ github.repository }} `
            --target ${{ github.sha }} --title "Dingus $v" --notes-file release-body.md

  # The Linux AppImage, attached to the same release.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install VLC
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output libvlc-dev libvlccore-dev libfuse2 > /dev/null
      - name: Build and attach the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oPm1 '(?<=<Version>)[^<]+' Dingus.csproj)
          if gh release view "v$V" --repo ${{ github.repository }} --json assets -q '.assets[].name' | grep -q "Dingus-$V-x86_64.AppImage"; then
            echo "The AppImage is already on v$V – nothing to do."; exit 0
          fi
          linux/package/build-appimage.sh "$V" out
          gh release upload "v$V" "out/Dingus-$V-x86_64.AppImage" --repo ${{ github.repository }} --clobber

  # Parked until the Mac version is finished – turn on by removing the "if: false".
  mac:
    if: false
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and attach the Mac disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Dingus.csproj | head -1)
          have=$(gh release view "v$V" --repo ${{ github.repository }} --json assets -q '.assets[].name')
          for arch in arm64 x64; do
            if echo "$have" | grep -q "Dingus-$V-mac-$arch.dmg"; then echo "The $arch disk image is already on v$V."; continue; fi
            linux/package/build-mac.sh "$V" $arch out
            gh release upload "v$V" "out/Dingus-$V-mac-$arch.dmg" --repo ${{ github.repository }} --clobber
          done

name: Release

# When the <Version> in Dingus.csproj changes on main (or on demand), build the installer and publish
# it as release vX.Y.Z – unless that release already exists. The app's updater offers the
# Dingus-Setup-x.y.z.exe attached to the latest release.
on:
  push:
    branches: [main]
    paths: ['Dingus.csproj']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content Dingus.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$v already exists – nothing to do."; "skip=true" >> $env:GITHUB_OUTPUT }
          else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      # Framework-dependent: the installer adds the .NET 8 Desktop Runtime only if the PC doesn't have it.
      - name: Publish
        if: steps.ver.outputs.skip == 'false'
        run: dotnet publish Dingus.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir=..\publish installer\Dingus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "installer\Output\Dingus-Setup-$v.exe" --repo ${{ github.repository }} `
            --target ${{ github.sha }} --title "Dingus $v" --notes-file installer\release-notes.md

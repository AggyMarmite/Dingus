name: Tidy release notes
# One-off: replaces "Sky-style info bar" with "Now & next info bar" in already-published release notes.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$REPO/releases?per_page=100" -q '.[].id'); do
            gh api "repos/$REPO/releases/$id" -q .body > body.md
            if grep -q 'Sky-style info bar' body.md; then
              sed -i 's/\*\*Sky-style info bar\*\*/**Now \& next info bar**/; s/Sky-style info bar/Now \& next info bar/' body.md
              jq -n --rawfile b body.md '{body:$b}' > body.json
              gh api -X PATCH "repos/$REPO/releases/$id" --input body.json -q '"updated \(.tag_name)"'
            fi
          done

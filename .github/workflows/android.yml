name: Android

# The Fire TV / Android TV app (android/). Builds the APK and tries it on a TV emulator.
on:
  push:
    branches: [main]
    paths: ['android/**', 'tests/android/**', '.github/workflows/android.yml', 'Dingus.csproj']
  workflow_dispatch:
    inputs:
      attach_to:
        description: 'Also put the APK (as Dingus.apk) on this existing release, e.g. v0.14.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: gradle -p android assembleRelease assembleDebug --no-daemon --stacktrace
      - name: Size
        run: |
          ls -la android/app/build/outputs/apk/*/
          echo "::notice title=apk::release $(du -k android/app/build/outputs/apk/release/*.apk | cut -f1) KB"
      - name: Put the APK on a release
        if: github.event_name == 'workflow_dispatch' && inputs.attach_to != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Dingus.apk
          gh release upload "${{ inputs.attach_to }}" Dingus.apk --repo ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/
          retention-days: 7

      # A TV emulator on Android 9 (what Fire OS 7 is built on).
      - name: Test video
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null 2>&1 || true
          mkdir -p $RUNNER_TEMP/www/hls
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 120 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 50 -c:a aac -f mpegts $RUNNER_TEMP/www/test.ts
          ffmpeg -loglevel error -i $RUNNER_TEMP/www/test.ts -c copy -hls_time 4 -hls_list_size 0 \
            -hls_segment_filename "$RUNNER_TEMP/www/hls/seg%03d.ts" $RUNNER_TEMP/www/hls/index.m3u8
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=330 -t 120 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -movflags +faststart $RUNNER_TEMP/www/test.mp4
          ffmpeg -loglevel error -f lavfi -i "gradients=s=400x600:c0=0x3B82F6:c1=0x9333EA:seed=1" -frames:v 1 $RUNNER_TEMP/www/poster1.png || ffmpeg -loglevel error -f lavfi -i color=c=0x3B82F6:s=400x600 -frames:v 1 $RUNNER_TEMP/www/poster1.png
          ffmpeg -loglevel error -f lavfi -i "gradients=s=400x600:c0=0xF59E0B:c1=0xDC2626:seed=7" -frames:v 1 $RUNNER_TEMP/www/poster2.png || ffmpeg -loglevel error -f lavfi -i color=c=0xDC2626:s=400x600 -frames:v 1 $RUNNER_TEMP/www/poster2.png
          cp android/app/build/outputs/apk/debug/app-debug.apk $RUNNER_TEMP/www/Dingus.apk
          nohup python3 tests/android/server.py $RUNNER_TEMP/www > /dev/null 2>&1 &
          sleep 1; curl -sf http://127.0.0.1:8000/playlist.m3u | head -3
      # A real WireGuard server for the VPN test: the emulator reaches it at 10.0.2.2, and the test playlist is
      # then only reachable through the tunnel (10.66.0.1).
      - name: WireGuard test server
        continue-on-error: true
        run: |
          set -x
          sudo timeout 120 apt-get install -y -q wireguard-tools || { sudo timeout 120 apt-get update -q; sudo timeout 180 apt-get install -y -q wireguard-tools; }
          which wg
          mkdir -p $RUNNER_TEMP/wg && cd $RUNNER_TEMP/wg && umask 077
          wg genkey > server.key; wg pubkey < server.key > server.pub
          wg genkey > client.key; wg pubkey < client.key > client.pub
          # Kernel WireGuard if allowed, otherwise the userspace engine (wireguard-go).
          if ! sudo ip link add wg0 type wireguard; then
            (cd /tmp && GOBIN=/tmp/wgbin go install golang.zx2c4.com/wireguard@latest) && sudo /tmp/wgbin/wireguard wg0
          fi
          sudo ip addr add 10.66.0.1/24 dev wg0
          cat server.key | sudo wg set wg0 listen-port 51820 private-key /dev/stdin peer "$(cat client.pub)" allowed-ips 10.66.0.2/32
          sudo ip link set wg0 up
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.66.0.2/32\n\n[Peer]\nPublicKey = %s\nEndpoint = 10.0.2.2:51820\nAllowedIPs = 10.66.0.0/24\nPersistentKeepalive = 15\n' "$(cat client.key)" "$(cat server.pub)" > client.conf
          echo "WG_CONF=$RUNNER_TEMP/wg/client.conf" >> $GITHUB_ENV
          sudo wg show
          # Surfshark's public server list (what the app shows as locations)
          curl -s https://api.surfshark.com/v4/server/clusters/generic | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d), 'Surfshark locations, e.g.', [(x.get('country'), x.get('location'), x.get('connectionName')) for x in d[:3]])" || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ runner.temp }}/selftest-android
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tests/android/run.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-android
          path: ${{ runner.temp }}/selftest-android
          retention-days: 7
      - name: Publish screenshots to the selftest-android branch
        if: always() && github.event_name != 'pull_request'
        run: |
          out=$RUNNER_TEMP/selftest-android
          [ -d "$out" ] || exit 0
          cp android/app/build/outputs/apk/release/*.apk "$out/" 2>/dev/null || true
          cd "$out"
          git init -q -b selftest-android
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "Android self-test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest-android

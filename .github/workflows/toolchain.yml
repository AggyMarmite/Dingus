name: Toolchain snapshot
# Development helper: packs the .NET SDK and the NuGet packages Dingus uses into the "toolchain" branch,
# so the code can be compiled in places without access to the .NET download servers.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install a private .NET 8 SDK (just the one version)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 8.0 --install-dir "$HOME/dn"
          echo "$HOME/dn" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/dn" >> $GITHUB_ENV
      - name: Restore both apps
        run: |
          export NUGET_PACKAGES="$HOME/nuget"
          dotnet restore linux/Dingus.Linux.csproj
          dotnet restore Dingus.csproj -p:EnableWindowsTargeting=true
      - name: Pack
        run: |
          set -e
          # The Windows VLC binaries aren't needed to compile – keep the package, drop the big files.
          find "$HOME/nuget/videolan.libvlc.windows" -type f -size +200k -delete || true
          rm -rf "$HOME/dn/sdk/"*/FSharp || true
          mkdir -p out
          tar -C "$HOME/dn" -czf out/sdk.tar.gz .
          tar -C "$HOME" -czf out/nuget.tar.gz nuget
          ls -la out
          cd out && split -b 45m sdk.tar.gz sdk.part. && split -b 45m nuget.tar.gz nuget.part. && rm sdk.tar.gz nuget.tar.gz
          ls -la
      - name: Push to the toolchain branch
        run: |
          cd out
          git init -q -b toolchain
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Toolchain snapshot"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" toolchain

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Dingus.csproj -c Release
      - name: Test live TV buffer
        run: dotnet run --project tests/TimeshiftTest/TimeshiftTest.csproj -c Release

      # A full-HD screen, so the screenshots look like a real desktop.
      - name: Screen to 1920×1080
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref dm);
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          '@
          $r = [Disp]::Set(1920, 1080)
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "::notice title=screen::change result $r · now $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # Opens the app with a sample playlist, visits every page and saves screenshots.
      - name: Self-test
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP 'sample'
          ./tests/selftest/make-sample.ps1 -Dir $sample
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          $exe = Get-ChildItem -Recurse -Filter Dingus.exe bin\Release | Select-Object -First 1
          $env:DINGUS_TEST_VIDEO = (Resolve-Path tests\selftest\test-video.mp4).Path
          $p = Start-Process $exe.FullName -ArgumentList '--self-test', "`"$out`"" -PassThru
          New-Item -ItemType Directory -Force $out | Out-Null
          if (-not $p.WaitForExit(240000)) {
            Write-Host '::warning::Self-test did not finish in time'
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$out\desktop-at-timeout.png")
            $p.Kill()
          }
          # Report through annotations as well (readable without downloading the log).
          foreach ($f in 'result.txt','crash.txt') {
            if (Test-Path "$out\$f") { $t = (Get-Content "$out\$f" -Raw) -replace "`r",'' -replace "`n",'%0A'; Write-Host "::notice title=$f::$t" }
          }
          if (-not (Test-Path "$out\started.txt")) { Write-Host '::warning::The app never started the self-test' }
          Write-Host "::notice title=exit::exit code $($p.ExitCode)"
          $log = "$env:LOCALAPPDATA\Dingus\log.txt"
          if (Test-Path $log) { $t = (Get-Content $log -Raw) -replace "`r",'' -replace "`n",'%0A'; Write-Host "::notice title=log.txt::$t"; Copy-Item $log $out }
          if (-not (Test-Path "$out\result.txt") -or -not (Select-String -Path "$out\result.txt" -Pattern 'PASSED' -Quiet)) { exit 1 }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: ${{ runner.temp }}/selftest
          retention-days: 7
      # Builds the installer exactly as a release would, installs it silently and runs the installed copy.
      - name: Installer test
        shell: pwsh
        run: |
          trap { Write-Host "::error title=installer test::$($_.Exception.Message) (line $($_.InvocationInfo.ScriptLineNumber))"; exit 1 }
          dotnet publish Dingus.csproj -c Release -r win-x64 --self-contained false -o publish
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $log = & $iscc /DAppVersion=0.0.0 /DSourceDir=..\publish installer\Dingus.iss 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { $t = ($log -split "`n" | Select-Object -Last 15) -join '%0A'; Write-Host "::error title=iscc::$t"; exit 1 }
          $setup = Get-Item installer\Output\Dingus-Setup-0.0.0.exe
          $size = [math]::Round($setup.Length / 1MB, 1)
          try { $r = Invoke-WebRequest -Method Head -Uri 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe' -MaximumRedirection 5 -UseBasicParsing }
          catch { Write-Host "::error title=dotnet link::$($_.Exception.Message)"; exit 1 }
          $rt = Get-ChildItem "$env:ProgramFiles\dotnet\shared\Microsoft.WindowsDesktop.App" -Directory | ForEach-Object Name
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          # Upgrade path: install the previous public release first (0.3.1 bundled .NET), then this one over it.
          $old = Join-Path $env:RUNNER_TEMP 'old-setup.exe'
          Invoke-WebRequest 'https://github.com/AggyMarmite/Dingus/releases/download/v0.3.1/Dingus-Setup-0.3.1.exe' -OutFile $old -UseBasicParsing
          $o = Start-Process $old -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"" -PassThru
          if (-not $o.WaitForExit(300000)) { $o.Kill() }
          Start-Sleep 5
          Get-Process Dingus -ErrorAction SilentlyContinue | Stop-Process -Force   # 0.3.1 reopens itself after a silent install
          $hadOldRuntime = Test-Path "$dir\coreclr.dll"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOLAUNCH',"/DIR=`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host '::warning::installer did not finish' }
          $ok = (Test-Path "$dir\Dingus.exe") -and -not (Test-Path "$dir\coreclr.dll")
          $out = Join-Path $env:RUNNER_TEMP 'selftest-installed'
          $q = Start-Process "$dir\Dingus.exe" -ArgumentList '--self-test', "`"$out`"" -PassThru
          if (-not $q.WaitForExit(240000)) { $q.Kill() }
          $res = if (Test-Path "$out\result.txt") { (Get-Content "$out\result.txt" | Select-Object -Last 1) } else { 'no result' }
          Write-Host "::notice title=installer::installer $size MB · .NET link HTTP $($r.StatusCode) · runtimes on runner: $($rt -join ', ') · setup exit $($p.ExitCode) · upgraded from 0.3.1 (had bundled .NET: $hadOldRuntime) · clean: $ok · installed self-test: $res"
          if (-not $ok -or $res -ne 'PASSED') { exit 1 }

      # Screenshots also go to the "selftest" branch, so they can be looked at without downloading artifacts.
      - name: Publish screenshots to the selftest branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          if (-not (Test-Path $out)) { exit 0 }
          Set-Location $out
          git init -q -b selftest
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "Self-test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest

  # Speed test: a big made-up playlist (30,000 channels, 80,000 films, 15,000 shows, a 300,000-programme guide) from a
  # stand-in Xtream server on the runner. Times start-up, loading and every page, and how long the window freezes.
  # Run twice: the first time (nothing saved) and the next time (opening on the saved copy while it refreshes).
  perf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (as a release would)
        run: dotnet publish Dingus.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Speed test
        shell: pwsh
        run: |
          $big = Join-Path $env:RUNNER_TEMP 'big'
          python tests/perf/make-big.py $big
          $srv = Start-Process python -ArgumentList 'tests/perf/fake-xtream.py', $big, '8765' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          Add-Type -AssemblyName System.Security
          $pw = [Convert]::ToBase64String([Security.Cryptography.ProtectedData]::Protect([Text.Encoding]::UTF8.GetBytes('perf'), $null, 'CurrentUser'))
          $appData = "$env:LOCALAPPDATA\Dingus"
          New-Item -ItemType Directory -Force $appData | Out-Null
          @{
            Playlists = @(@{ Id = 'perf'; Name = 'Big provider'; Type = 0; Server = 'http://127.0.0.1:8765'; Username = 'perf'; ProtectedPassword = $pw })
            ActivePlaylistId = 'perf'; AutoUpdate = $false; Timeshift = $false; OnlineArtwork = $false
          } | ConvertTo-Json -Depth 6 | Set-Content -Path "$appData\settings.json" -Encoding UTF8
          $exe = (Resolve-Path publish\Dingus.exe).Path
          $failed = $false
          foreach ($run in 'first-run', 'next-run') {
            $out = Join-Path $env:RUNNER_TEMP "perf\$run"
            New-Item -ItemType Directory -Force $out | Out-Null
            $p = Start-Process $exe -ArgumentList '--perf-test', "`"$out`"" -PassThru
            if (-not $p.WaitForExit(900000)) { Write-Host "::warning::$run did not finish in time"; $p.Kill(); $failed = $true }
            foreach ($f in 'result.txt', 'crash.txt') {
              if (Test-Path "$out\$f") { $t = (Get-Content "$out\$f" -Raw) -replace "`r", '' -replace "`n", '%0A'; Write-Host "::notice title=$run $f::$t" }
            }
            if (-not (Select-String -Path "$out\result.txt" -Pattern 'PASSED' -Quiet -ErrorAction SilentlyContinue)) { $failed = $true }
          }
          $log = "$appData\log.txt"
          if (Test-Path $log) { $t = (Get-Content $log -Raw) -replace "`r", '' -replace "`n", '%0A'; Write-Host "::notice title=perf log.txt::$t"; Copy-Item $log (Join-Path $env:RUNNER_TEMP 'perf') }
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }
      - name: Publish results to the selftest-perf branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'perf'
          if (-not (Test-Path $out)) { exit 0 }
          Set-Location $out
          git init -q -b selftest-perf
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "Speed test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest-perf

  # The Linux version: builds the AppImage, then runs it on a virtual screen (with a real test video) and saves screenshots.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install VLC and a virtual screen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends vlc-bin vlc-plugin-base vlc-plugin-video-output libvlc-dev libvlccore-dev \
            xvfb openbox xcompmgr ffmpeg imagemagick libfuse2 fonts-dejavu-core > /dev/null
      - name: Recording timeline fix (a recording with jumps in its time marks comes out the right length)
        run: |
          d=$RUNNER_TEMP/ts; mkdir -p $d
          mk() { ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=$3 -t $1 -c:v libx264 -preset ultrafast -g 50 -pix_fmt yuv420p -c:a aac -shortest -output_ts_offset $2 -f mpegts $d/$4; }
          mk 40 10 440 a.ts; mk 40 21600 660 b.ts; mk 40 5 880 c.ts; mk 40 95420 500 wrap.ts
          cat $d/a.ts $d/b.ts > $d/jump.ts; cat $d/a.ts $d/b.ts $d/c.ts > $d/jumps.ts
          dotnet run --project tests/RecordingTest -c Release -- $d/jump.ts $d/jumps.ts $d/wrap.ts $d/a.ts
          check() { got=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $d/$1); errs=$(ffmpeg -v error -i $d/$1 -f null - 2>&1 | wc -l)
                    echo "::notice title=recording $1::length ${got}s (expected about $2 s) · decode warnings $errs"
                    python3 -c "import sys; sys.exit(0 if abs(float('$got')-$2) < 3 and $errs == 0 else 1)"; }
          check jump.fixed.ts 80; check jump.live.ts 80; check jumps.fixed.ts 121; check jumps.live.ts 121
          check wrap.fixed.ts 40; check a.live.ts 40
      - name: Build the AppImage
        run: |
          V=$(grep -oPm1 '(?<=<Version>)[^<]+' Dingus.csproj)
          linux/package/build-appimage.sh "$V" out
          f=$(ls out/*.AppImage)
          echo "::notice title=AppImage::$(basename $f) · $(du -m $f | cut -f1) MB"
      - name: Self-test (the AppImage itself)
        run: |
          python3 tests/selftest/make-sample.py $RUNNER_TEMP/sample
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 30 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $RUNNER_TEMP/sample/test.mp4
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          export DISPLAY=:99
          openbox &
          xcompmgr &
          sleep 1
          out=$RUNNER_TEMP/selftest-linux
          mkdir -p $out
          app=$(ls $PWD/out/*.AppImage)
          DINGUS_TEST_VIDEO=$RUNNER_TEMP/sample/test.mp4 APPIMAGE_EXTRACT_AND_RUN=1 timeout 300 "$app" --self-test $out > $out/stdout.txt 2>&1 &
          pid=$!
          for i in $(seq 1 280); do
            if [ -f $out/player-ready.txt ]; then sleep 1; import -window root $out/19-screen-player.png; break; fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          wait $pid || true
          for f in result.txt crash.txt; do
            if [ -f $out/$f ]; then echo "::notice title=linux $f::$(head -c 4000 $out/$f | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
          done
          if [ -f ~/.local/share/Dingus/log.txt ]; then cp ~/.local/share/Dingus/log.txt $out/; echo "::notice title=linux log.txt::$(head -c 3000 ~/.local/share/Dingus/log.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
          tail -c 2000 $out/stdout.txt | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::notice title=linux stdout::{}"
          grep -q PASSED $out/result.txt
      - name: Publish screenshots to the selftest-linux branch
        if: always() && github.event_name == 'push'
        run: |
          out=$RUNNER_TEMP/selftest-linux
          [ -d $out ] || exit 0
          cd $out
          git init -q -b selftest-linux
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Linux self-test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest-linux

  # Parked: the Mac version isn't finished (video doesn't play yet). Runs only when started by hand.
  mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the Mac apps (Apple Silicon and Intel)
        run: |
          V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Dingus.csproj | head -1)
          for arch in arm64 x64; do
            if ! linux/package/build-mac.sh "$V" $arch out > $RUNNER_TEMP/build-$arch.log 2>&1; then
              echo "::error title=Mac build ($arch)::$(tail -c 3500 $RUNNER_TEMP/build-$arch.log | tr '\n' '\r' | sed 's/\r/%0A/g')"
              exit 1
            fi
            tail -5 $RUNNER_TEMP/build-$arch.log
          done
          for f in out/*.dmg; do echo "::notice title=Mac::$(basename $f) · $(du -m $f | cut -f1) MB"; done
      - name: Self-test (the Apple Silicon app)
        run: |
          command -v ffmpeg > /dev/null || brew install -q ffmpeg > /dev/null
          python3 tests/selftest/make-sample.py $RUNNER_TEMP/sample
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 30 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $RUNNER_TEMP/sample/test.mp4
          out=$RUNNER_TEMP/selftest-mac
          mkdir -p $out
          P=out/Dingus-arm64.app/Contents/Frameworks/vlc
          { otool -L $P/plugins/libhttp_plugin.dylib; otool -l $P/plugins/libhttp_plugin.dylib | grep -A2 LC_RPATH; otool -L $P/lib/libvlccore.9.dylib | head -5;
            otool -l $P/lib/libvlccore.9.dylib | grep -A2 LC_RPATH; codesign -dv $P/plugins/libhttp_plugin.dylib 2>&1 | head -4; } > $out/vlc-libs.txt 2>&1 || true
          echo "::notice title=mac vlc-libs::$(head -c 3000 $out/vlc-libs.txt | tr '\n' '\r' | sed 's/\r/%0A/g')"
          export VLC_VERBOSE=2
          DINGUS_TEST_VIDEO=$RUNNER_TEMP/sample/test.mp4 out/Dingus-arm64.app/Contents/MacOS/dingus --self-test $out > $out/stdout.txt 2>&1 &
          pid=$!
          for i in $(seq 1 280); do
            if [ -f $out/player-ready.txt ]; then sleep 1; screencapture -x $out/19-screen-player.png || true; break; fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          ( sleep 60; kill $pid 2>/dev/null ) &
          wait $pid || true
          for f in vlc-check.txt result.txt crash.txt; do
            if [ -f $out/$f ]; then echo "::notice title=mac $f::$(head -c 4000 $out/$f | tr '\n' '\r' | sed 's/\r/%0A/g')"; fi
          done
          log="$HOME/Library/Application Support/Dingus/log.txt"
          if [ -f "$log" ]; then cp "$log" $out/; echo "::notice title=mac log.txt::$(head -c 3000 "$log" | tr '\n' '\r' | sed 's/\r/%0A/g')"; fi
          echo "::notice title=mac stdout::$(grep -iE 'error|warn|cannot|fail|plugin|dlopen' $out/stdout.txt | head -c 4000 | tr '\n' '\r' | sed 's/\r/%0A/g')"
          grep -q PASSED $out/result.txt
      - name: Publish screenshots to the selftest-mac branch
        if: always() && github.event_name == 'push'
        run: |
          out=$RUNNER_TEMP/selftest-mac
          [ -d $out ] || exit 0
          cd $out
          git init -q -b selftest-mac
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Mac self-test for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" selftest-mac
